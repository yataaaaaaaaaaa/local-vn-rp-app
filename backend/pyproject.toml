[project]
name = "local-vn-rp-app-backend"
version = "0.1.0"
description = "HTTP compatibility wrapper around anything-backend-runtime for the local VN/RP app."
requires-python = ">=3.11"
dependencies = ["anything-backend-runtime"]

[project.scripts]
local-vn-rp-app-backend = "local_vn_rp_backend.simple_server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["local_vn_rp_backend*"]

[tool.uv.sources]
anything-backend-runtime = { path = "D:/Anything/libs/anything-backend-runtime", editable = true }
