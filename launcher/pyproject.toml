[project]
name = "local-vn-rp-app-launcher"
version = "0.1.0"
description = "Top-level launcher module for the local VN/RP app."
requires-python = ">=3.11,<3.14"
dependencies = ["devlauncher", "local-vn-rp-app-backend"]

[tool.uv]
package = true

[tool.uv.sources]
devlauncher = { path = "D:/Anything/libs/devlauncher_reusable_pattern", editable = true }
local-vn-rp-app-backend = { path = "../backend", editable = true }


[project.scripts]
vn-rp-launcher = "vn_rp_launcher.cli:main"
